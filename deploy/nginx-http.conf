limit_req_zone $binary_remote_addr zone=maki_api:10m rate=10r/s;

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    client_max_body_size 2m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml application/x-tex;

    location /.well-known/acme-challenge/ { root /var/www/acme; }

    # MathJax：直接发预压缩好的文件，缓存 30 天
    location /mathjax/ {
        alias __APP__/node_modules/mathjax/es5/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=maki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/maki-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/maki-proxy.inc;
    }
}
