limit_req_zone $binary_remote_addr zone=maki_api:10m rate=10r/s;

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.__DOMAIN__;
    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    return 301 https://__DOMAIN__$request_uri;
}
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;
    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml application/x-tex;

    location /.well-known/acme-challenge/ { root /var/www/acme; }

    # MathJax：直接发预压缩好的文件，缓存 30 天
    location /mathjax/ {
        alias __APP__/node_modules/mathjax/es5/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=maki_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/maki-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/maki-proxy.inc;
    }
}
